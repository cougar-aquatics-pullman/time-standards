name: Update Time Standards

on:
  workflow_dispatch:

  schedule:
    - cron: "17 12 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Update time standards
        run: |
          python scripts/update_time_standards.py

      - name: Commit changes
        run: |
          git config user.name "Cougar Aquatics Bot"
          git config user.email "actions@github.com"

          git add index.html

          if git diff --cached --quiet; then
            echo "No time standards changes."
          else
            git commit -m "Automatic time standards update"
            git push
          fi
